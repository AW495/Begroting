<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Begroting & boekhouding</title>
<style>
:root{
  --teal:#1F4E5A; --teal2:#2c6474; --bg:#f5f6f4; --card:#fff; --ink:#1d2326; --ink2:#52514e; --muted:#8a8a86;
  --line:#e2e3df; --warn:#b4471c; --good:#2e7d32; --bad:#c00000; --in:#fff7dd;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal2)}
.hidden{display:none!important}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
header.top .file{font-size:12px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
header.top .dirty{font-size:12px;background:#f2b84b;color:#3a2a00;border-radius:20px;padding:2px 9px;white-space:nowrap}
header.top button{background:#fff;color:var(--teal);border:0;border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
header.top #helpBtn{width:34px;padding:7px 0;border-radius:50%;font-weight:700}
header.top #fileBtn{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
header.top #fileBtn.on{background:rgba(255,255,255,.18)}
.dlg.wide{max-width:760px}
details.hlp{border-top:1px solid var(--line);padding:8px 0}
details.hlp summary{font-weight:700;color:var(--teal);cursor:pointer;font-size:15px}
details.hlp div{font-size:13.5px;line-height:1.55;color:var(--ink)}
details.hlp li{margin:4px 0}
nav.tabs{position:sticky;top:48px;z-index:15;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px;color:var(--ink2);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
nav.tabs .sh{display:none}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1500px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px;color:var(--teal)}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12px} .warn{color:var(--warn);font-weight:600} .good{color:var(--good)} .bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:600}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px;font-weight:500}
.icon{border:0;background:none;padding:2px 6px;color:var(--muted);font-size:15px}
.icon:hover{color:var(--ink)}
select,input[type=text],input[type=number],input[type=date],input[type=password],input[type=search]{border:1px solid #cfd1cc;border-radius:7px;padding:6px 8px;background:#fff;min-width:0}
input.in,select.in{background:var(--in)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st-actief{background:#c8e6c9;color:#1b5e20}.st-gestopt{background:#f8c9c4;color:#b71c1c}.st-toekomst{background:#e3e8f0;color:#3b5b8c}
.via{font-size:11px;color:var(--muted)}
.qmark{background:#f9d6cc;color:var(--warn);font-weight:700}
tr.focus td{animation:focusflash 3s ease-out}
@keyframes focusflash{0%,40%{background:#fff1b8}100%{background:transparent}}
.nw{white-space:nowrap}
.mlab{display:none}
.bcard{padding:10px 12px;border-bottom:1px solid #eeefeb;background:#fff;cursor:pointer}
.bcard .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bcard .l1 .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bcard .l2{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--ink2);margin-top:3px}
.bcard.focus{animation:focusflash 3s ease-out}
.bgrp{color:#fff;font-weight:700;font-size:13px;padding:7px 12px;letter-spacing:.3px}
.txpanel .f2{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);margin:10px 0 0}
.txpanel .f2 select{font-size:14px;padding:6px 6px}
td.avgb{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid #eeefeb}
th{font-size:12px;color:#fff;background:var(--teal);font-weight:600;white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{color:#fff;font-weight:700;font-size:13px;letter-spacing:.3px}
tr.tot td{font-weight:700;border-top:2px solid currentColor}
tr.saldo td{font-weight:700;background:#dce6e8;border-top:2px solid var(--teal)}
tr.click{cursor:pointer} tr.click:hover td{background:#f2f6f7}
td.gap,th.gap{width:14px;padding:0;background:transparent!important;border:0}
.secsw{display:none}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;flex:none}
.mode button{border:0;background:#fff;padding:7px 13px;font-weight:600;color:var(--ink2);font-size:13px}
.mode button+button{border-left:1px solid var(--line)}
.mode button.on{background:var(--teal);color:#fff}
.mode.sm button{padding:5px 10px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.tile .k{font-size:12px;color:var(--ink2);font-weight:600}
.tile .v{font-size:24px;font-weight:700;color:var(--ink);margin:2px 0;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;line-height:1.45}
.lc{position:relative;width:100%;min-height:200px;touch-action:pan-y}
.lc svg{display:block;max-width:100%;height:auto;font-variant-numeric:tabular-nums}
.lc .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;min-width:170px;z-index:5;display:none}
.lc .tip .r{display:flex;gap:12px;align-items:center;justify-content:space-between;line-height:1.7}
.lc .tip .r.on{font-weight:700;background:#f2f6f7;margin:0 -6px;padding:0 6px;border-radius:5px}
.lc .tip .hint{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--teal);line-height:1.4}
.lc .tip .sw,.opv .sw{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:#fff;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.chip .sw{width:11px;height:11px;border-radius:3px;border:2px solid transparent}
.chip.off{color:var(--muted);background:#f5f6f4}
.chip.off .sw{background:transparent!important;border-color:currentColor}
.opv{list-style:none;margin:0;padding:0}
.opv li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.opv li:hover{background:#f7f8f6}
.reeks-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.reeks td,table.reeks th{white-space:nowrap}
table.reeks td:first-child,table.reeks th:first-child{position:sticky;left:0;z-index:2;background:#fff}
table.reeks th:first-child{background:var(--teal);z-index:3}
table.reeks tr[style*="background"] td:first-child{background:inherit}
table.reeks .yb{border-left:2px solid var(--line)}
table.reeks th.yb{border-left-color:rgba(255,255,255,.35)}
table.reeks td.avgc{border-left:2px solid var(--line);color:var(--ink2)}
table.reeks tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--teal);font-weight:700}
.cmp th.sh{background:#fff;color:var(--teal);font-size:13px;border-bottom:0}

/* forms in lists */
.list input[type=text],.list input[type=number],.list input[type=date],.list select{width:100%}
.list td{padding:3px 4px}

/* dialogs */
.back{position:fixed;inset:0;background:rgba(20,30,35,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{font-size:17px;color:var(--teal)}
.dlg .row{margin:8px 0}
.dlg label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 3px}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.drop{border:2px dashed #b9c4c6;border-radius:12px;padding:22px;text-align:center;color:var(--ink2);background:#fafbfa}
.drop.over{border-color:var(--teal);background:#eef5f6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:60;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}

/* start */
.start{max-width:620px;margin:40px auto;text-align:center}
.start .card{text-align:left}

/* transacties: lijst per dag + bewerkpaneel */
.txwrap{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.txmain{flex:999 1 560px;min-width:0}
.txlist{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.txday{display:flex;gap:8px;align-items:center;background:#f2f4f1;padding:7px 14px;font-size:12px;font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line)}
.txday span:first-child{flex:1}
.txr{display:grid;grid-template-columns:26px minmax(0,1fr) 230px 110px;grid-template-areas:"ck nm ct am";gap:4px 12px;align-items:center;padding:9px 14px;border-bottom:1px solid #eeefeb;cursor:pointer;background:#fff}
.txr:hover{background:#f7f9f8}
.txr.on{background:#EAF1FB}
.txr.cur{background:#EAF1FB;box-shadow:inset 3px 0 0 #2A5DA8}
.txr .ck{grid-area:ck;width:22px;height:22px;margin:0;accent-color:#2A5DA8}
.txr .nm{grid-area:nm;min-width:0}
.txr .nm b{display:inline}
.txr .nm .l{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.txr .nm .l b{overflow:hidden;text-overflow:ellipsis}
.txr .ct{grid-area:ct;min-width:0}
.txr .ct select{width:100%}
.txr .am{grid-area:am;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.txr .desc{max-width:none}
.tb{display:inline-block;font-size:11px;font-weight:600;border-radius:20px;padding:0 7px;line-height:17px;flex:none}
.tb-nieuw{background:#e3e8f0;color:#2c4a7a}.tb-hand{background:#efeaf7;color:#4e3780}.tb-split{background:#fbede4;color:#8a3c12}.tb-aangepast{background:#eeefeb;color:#52514e}.tb-label{background:#e8f3e9;color:#1b5e20}
.splitpill{display:flex;align-items:center;gap:6px;border:1px solid #cfd1cc;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:600;background:#fff}
.splitpill.split2{flex-direction:column;align-items:stretch;gap:1px;padding:5px 8px;background:#fbede4;border-color:#efd3c0}
.split2 .sp{display:flex;justify-content:space-between;gap:10px;font-weight:500;line-height:1.35}
.split2 .sp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split2 .sp b{font-variant-numeric:tabular-nums;white-space:nowrap}
.txpanel{flex:1 1 340px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 6px 24px rgba(20,30,35,.08);position:sticky;top:100px;max-height:calc(100vh - 110px);overflow:auto}
.txpanel h3{font-size:17px;color:var(--teal);margin:0;flex:1}
.txpanel label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);margin:10px 0 0}
.txpanel label.f input,.txpanel label.f select{font-size:14px;padding:7px 8px;width:100%}
.txpanel .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.txpanel .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.txpanel .orig{background:#f2f4f1;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink2);margin-top:10px}
.txpanel .srow{display:grid;grid-template-columns:minmax(0,1fr) 96px 28px;gap:6px;align-items:center;margin-top:6px}
.txpanel .srow input{text-align:right;width:100%}
.txpanel .srow select{width:100%}
.txpanel .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid #eeefeb;padding-top:12px;margin-top:14px}
.lblchip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 4px 2px 10px;background:#e8f3e9;color:#1b5e20;font-size:12px;font-weight:600}
.lblchip button{border:0;background:none;color:inherit;padding:0 4px;font-size:13px}
.bulk{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#2A5DA8;color:#fff;border-radius:10px;padding:8px 10px;margin:0 0 10px}
.bulk select{flex:1;min-width:160px;max-width:320px;color:#1d1d1d;background:#fff}
.bulk .btn{background:#fff;color:#2A5DA8;border-color:#fff}
.selall{display:flex;gap:8px;align-items:center;padding:4px 2px 8px;border-bottom:1px solid var(--line)}
.desc{font-size:11px;color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chart{width:100%;max-width:640px}
.help{background:#eef5f6;border-left:4px solid var(--teal2);padding:10px 12px;border-radius:6px;color:#24434b;margin-bottom:12px}
.help ol{margin:4px 0 0;padding-left:20px}

@media (max-width:820px){
  header.top h1{display:none}
  header.top .lg{display:none}
  header.top{gap:8px;padding-left:12px;padding-right:12px}
  header.top button{padding:7px 10px}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom)}
  nav.tabs button{border-bottom:0;border-top:3px solid transparent;padding:10px 4px;font-size:11px}
  nav.tabs .lg{display:none} nav.tabs .sh{display:inline}
  nav.tabs .badge{margin-left:2px;min-width:15px;line-height:15px;font-size:10px;padding:0 3px}
  nav.tabs button.on{border-top-color:var(--teal)}
  main{padding:10px 8px 90px}
  .card{padding:12px}
  .secsw{display:flex}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .v{font-size:20px}
  .cmp .sec-y,.cmp .sec-f{display:none}
  .cmp.show-y .sec-p,.cmp.show-f .sec-p{display:none}
  .cmp.show-y .sec-y{display:table-cell}
  .cmp.show-f .sec-f{display:table-cell}
  .cmp td.gap,.cmp th.gap{display:none}
  #csvDrop{display:none}
  .txr{grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"ck nm am" "ck ct ct";padding:9px 10px}
  .txpanel{position:fixed;inset:0;z-index:40;max-height:none;border-radius:0;border:0;padding:14px 14px calc(30px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
  th,td{padding:5px 5px}
  .mlab{display:inline}
  table.cattbl,table.cattbl tbody,table.grptbl,table.grptbl tbody{display:block}
  table.cattbl tr:first-child,table.grptbl tr:first-child{display:none}
  table.cattbl tr.grp,table.cattbl tr:not(.crow){display:block}
  table.cattbl tr:first-child:not(.crow){display:none}
  table.cattbl tr:not(.crow) td{display:block}
  table.cattbl tr.crow,table.grptbl tr.grow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr);gap:5px 6px;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.cattbl tr.crow td,table.grptbl tr.grow td{display:block;padding:0;border:0}
  table.cattbl tr.crow td:nth-child(1),table.grptbl tr.grow td:nth-child(1){grid-row:1 / span 3;display:flex;flex-direction:column;justify-content:flex-start}
  table.cattbl tr.crow td:nth-child(2),table.grptbl tr.grow td:nth-child(2){grid-column:2 / span 2}
  table.cattbl tr.crow td:nth-child(5){grid-column:2}
  table.cattbl tr.crow td:nth-child(6){grid-column:3;display:flex;align-items:center;justify-content:flex-end}
  table.grptbl tr.grow td:nth-child(5){grid-column:2}
  table.grptbl tr.grow td:nth-child(6){grid-column:3;text-align:left!important;display:flex;align-items:center}
  table.grptbl tr.grow td:nth-child(7){grid-column:2 / span 2;text-align:right}
}
</style>
</head>
<body>
<header class="top">
  <h1>Begroting & boekhouding</h1>
  <span class="file" id="fileName"></span>
  <span class="dirty hidden" id="dirty">●<span class="lg"> niet bewaard</span></span>
  <button id="backBtn" class="hidden" onclick="history.back()" aria-label="Terug naar het vorige scherm">‹<span class="lg"> Terug</span></button>
  <button id="helpBtn" data-act="help" aria-label="Uitleg" title="Uitleg">?</button>
  <button id="fileBtn" class="hidden" data-act="gobestand">Bestand</button>
  <button id="saveBtn" class="hidden">Bewaar</button>
</header>
<nav class="tabs hidden" id="tabs"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileOpen" accept=".json,.begroting,application/json" class="hidden">
<input type="file" id="csvOpen" accept=".csv,text/csv" multiple class="hidden">

<script>
"use strict";
/* =====================================================================
   Begroting & boekhouding – draait volledig in de browser.
   Gegevens blijven op je eigen apparaat: in het gegevensbestand dat je zelf bewaart
   (plus een veiligheidskopie in deze browser).
   ===================================================================== */

const APPV = 2;
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const FREQS = ["maand","kwartaal","halfjaar","jaar","eenmalig"];
const FAC = {maand:1,kwartaal:1/3,halfjaar:1/6,jaar:1/12,eenmalig:0};
const LS_KEY = "begroting.veiligheidskopie.v1";

let D = null;            // alle gegevens
let fileHandle = null;   // bestand (alleen Chrome/Edge)
let fileName = "";
let password = null;     // alleen in geheugen
let dirty = false;
let view = "vergelijk";
let ui = {cmpSec:"p", txMonth:"periode", txCat:"", txSearch:"", txView:"all", txAcc:"__all", txLbl:"", txEdit:null, draft:null, budSort:"categorie", txSel:new Set(), budStatus:new Set(["actief","gestopt","toekomst"]), showEmpty:true};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const nf2 = new Intl.NumberFormat("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("nl-NL",{maximumFractionDigits:0});
const eur = v => (v === "" || v == null || isNaN(v)) ? "" : nf2.format(Math.abs(v) < 0.005 ? 0 : v);
const eur0 = v => (v === "" || v == null || isNaN(v)) ? "" : nf0.format(Math.abs(v) < 0.5 ? 0 : v);
const pct = v => (v === "" || v == null || !isFinite(v)) ? "" : Math.round(v*100) + "%";
const mi = iso => iso ? (parseInt(iso.slice(0,4))*12 + parseInt(iso.slice(5,7)) - 1) : null;   // maandnummer
const miName = m => MAANDEN[((m%12)+12)%12] + " " + Math.floor(m/12);
const todayMi = () => { const d = new Date(); return d.getFullYear()*12 + d.getMonth(); };
const fmtDate = iso => iso ? `${iso.slice(8,10)}-${iso.slice(5,7)}-${iso.slice(0,4)}` : "";

function lighten(hex){ const n = parseInt(hex, 16); const mix = c => Math.round(c + (255 - c) * 0.88);
  const r = mix(n >> 16 & 255), g = mix(n >> 8 & 255), b = mix(n & 255); return ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase(); }

/* ---------- indelen (zelfde logica als in Numbers) ---------- */
let CACHE = null;
function invalidate(){ CACHE = null; }
const sq = s => String(s||"").replace(/\s+/g," ").trim();
function shopOf(t){ if (t.name && t.name.trim()) return sq(t.name); const i=(t.desc||"").indexOf(">"); return i>=0 ? sq(t.desc.slice(0,i)) : ""; }
function firstWord(s){ let x=s||""; const st=x.indexOf("*"); if(st>=0) x=x.slice(st+1).trim(); const sp=x.indexOf(" "); return sp>=0 ? x.slice(0,sp) : x; }
function build(){
  if (CACHE) return CACHE;
  const catByName = new Map(D.categories.map(c => [c.name, c]));
  const grpByName = new Map(D.groups.map(g => [g.name, g]));
  const nameMap = new Map();
  for (const r of D.rules.names) { if(!r.key) continue; const k = sq(r.key).toLowerCase() + (r.dir ? "|"+r.dir : ""); if(!nameMap.has(k)) nameMap.set(k, r); }
  const snsMap = new Map();
  for (const r of D.rules.sns) { if(!r.sns) continue; const k=r.sns.trim().toLowerCase(); if(!snsMap.has(k)) snsMap.set(k, r); }
  const valid = n => catByName.has(n) ? n : "?";
  const res = new Map(); const ruleHits = new Map();
  for (const t of D.transactions) {
    const dir = t.amount < 0 ? "af" : "bij";
    let auto="?", avia="niet herkend", rule=null;
    const text = ((t.name||"") + " " + (t.desc||"")).toLowerCase();
    let best = 0;
    for (const w of D.rules.words) {
      const wt = (w.text||"").trim().toLowerCase();
      if (!wt || (w.dir && w.dir !== dir)) continue;
      if (wt.length > best && text.includes(wt)) { rule=w; avia="zoekwoord"; best = wt.length; }
    }
    if (!rule) {
      const shop = shopOf(t);
      for (const k of [shop, firstWord(shop), t.counter]) {
        if (!k) continue; const kk = k.toLowerCase();
        const r = nameMap.get(kk+"|"+dir) || nameMap.get(kk);
        if (r) { rule=r; avia="naam/winkel/IBAN"; break; }
      }
    }
    if (!rule && t.snsCat) { const r = snsMap.get(t.snsCat.trim().toLowerCase()); if (r) { rule=r; avia="SNS-categorie"; } }
    if (rule) auto = valid(rule.category);
    let cat = auto, via = avia;
    const isSplit = Array.isArray(t.splits) && t.splits.length >= 2;
    if (isSplit) { via = "gesplitst"; }
    else if (t.manual) { cat = valid(t.manual); via = t.source === "manual" ? "handmatig toegevoegd" : "handmatig"; }
    else if (rule) ruleHits.set(rule.id, (ruleHits.get(rule.id)||0)+1);
    else if (t.source === "manual") via = "handmatig toegevoegd";
    const c = catByName.get(cat); const g = c ? grpByName.get(c.group) : null;
    // delen: bij een gesplitste transactie één deel per categorie, anders één deel met het hele bedrag
    let parts;
    if (isSplit) {
      const sgn = t.amount < 0 ? -1 : 1;
      parts = t.splits.map(s => { const pc = valid(s.category), c2 = catByName.get(pc), g2 = c2 ? grpByName.get(c2.group) : null;
        return {cat: pc, amount: sgn * Math.abs(+s.amount || 0), sign: g2 ? g2.sign : -1, group: g2 ? g2.name : "?"}; });
      cat = "Gesplitst";
    } else parts = [{cat, amount: t.amount, sign: g ? g.sign : -1, group: g ? g.name : "?"}];
    const q = parts.some(p => p.cat === "?");
    res.set(t.id, {cat, via, auto, rule, split: isSplit, parts, q, todo: q || !!t.todo, group: isSplit ? "Gesplitst" : (g ? g.name : "?"), sign: g ? g.sign : -1, m: mi(t.date)});
  }
  let first = Infinity, last = -Infinity;
  for (const t of D.transactions) { const m = mi(t.date); if (m < first) first = m; if (m > last) last = m; }
  CACHE = {res, ruleHits, catByName, grpByName, first, last};
  return CACHE;
}

/* ---------- begroting ---------- */
/* Begroting op betaalmoment: maand = elke maand; kwartaal/halfjaar/jaar = alleen in de betaalmaanden
   (de maand van de startdatum, en daarna elke 3, 6 of 12 maanden); eenmalig = in de maand van de startdatum. */
const PSTEP = {kwartaal:3, halfjaar:6, jaar:12};
function payMonths(b, lo, hi){
  const step = PSTEP[b.freq]; if (!step) return [];
  const s = b.start ? mi(b.start) : 2000*12, e = b.end ? mi(b.end) : Infinity, out = [];
  for (let m = lo <= s ? s : s + Math.ceil((lo - s) / step) * step; m <= Math.min(hi, e); m += step) out.push(m);
  return out;
}
function budgetIn(b, lo, hi){
  const amt = +b.amount || 0; if (!b.category || !amt || hi < lo) return 0;
  const s = b.start ? mi(b.start) : -Infinity, e = b.end ? mi(b.end) : Infinity;
  if (b.freq === "eenmalig") return (s >= lo && s <= hi) ? amt : 0;
  if (PSTEP[b.freq] && b.pmok) return amt * payMonths(b, lo, hi).length;   // betaalmaand gecontroleerd: op betaalmoment
  // nog niet gecontroleerd (oude regels): zoals vroeger gespreid vanaf de startmaand
  const n = Math.max(0, Math.min(e, hi) - Math.max(s, lo) + 1);
  return amt * (FAC[b.freq] ?? 0) * n;
}
/* gespreid: wat je per maand opzij zet – een jaarpost telt elk maand voor 1/12 van wat er dat jaar betaald wordt */
function budgetSpread(b, lo, hi){
  if (!(PSTEP[b.freq] && b.pmok)) return budgetIn(b, lo, hi);
  const amt = +b.amount || 0; if (!b.category || !amt || hi < lo) return 0;
  let tot = 0;
  for (let y = Math.floor(lo / 12); y <= Math.floor(hi / 12); y++) {
    const n = payMonths(b, y*12, y*12 + 11).length; if (!n) continue;
    tot += amt * n * (Math.min(hi, y*12 + 11) - Math.max(lo, y*12) + 1) / 12;
  }
  return tot;
}
function budgetStatus(b){
  const cur = todayMi(); let s = b.start ? mi(b.start) : -Infinity; const e = b.end ? mi(b.end) : Infinity;
  if (PSTEP[b.freq]) {                                                  // jaar/halfjaar/kwartaal: volgens de betaalmaanden
    if (isFinite(s) && Math.floor(s / 12) > Math.floor(cur / 12)) return "toekomst";
    return payMonths(b, cur, Math.min(e, cur + 24)).length ? "actief" : "gestopt";
  }
  if (s > cur) return "toekomst"; return e >= cur ? "actief" : "gestopt";
}
const STATUS_LABEL = {actief:"actief",gestopt:"gestopt",toekomst:"nog niet begonnen"};

/* ---------- periode ---------- */
function defaultPeriod(){
  const c = build(); const m = isFinite(c.last) ? c.last : todayMi();
  return {p1:m, p2:m};
}
function period(){
  ui.p1 ??= defaultPeriod().p1; ui.p2 ??= ui.p1;
  const p1 = ui.p1, p2 = ui.p2 ?? ui.p1;
  const y1 = Math.floor(p2/12)*12, ye = y1+11;
  return {p1, p2, y1, ye, ok: p2 >= p1};
}

/* ---------- berekening Vergelijk ---------- */
function compute(Pov){
  const P = Pov || period(), C = build(), cur = todayMi();
  // laatste maand die meetelt: de gekozen eindmaand, maar nooit verder dan de laatste maand met ingelezen transacties
  const ref = Math.min(P.p2, cur, isFinite(C.last) ? C.last : cur);
  const rem = Math.max(0, P.ye - Math.max(ref, P.y1 - 1));           // resterende maanden dit jaar
  // gemiddelde: afgelopen 12 maanden t/m ref, gedeeld door het aantal maanden waarin er transacties zijn
  const w1 = ref - 11, dataM = new Set();
  for (const t of D.transactions) { const m = C.res.get(t.id).m; if (m >= w1 && m <= ref) dataM.add(m); }
  const el = dataM.size;
  // gemiddeld per maand = begroting van het jaar (jaarposten gespreid) / het aantal maanden van dat jaar waarin de begroting loopt
  const bStart = D.budget.reduce((a, b) => Math.min(a, b.start ? mi(b.start) : -Infinity), Infinity);
  const nB0 = P.ye - Math.max(P.y1, isFinite(bStart) ? bStart : P.y1) + 1, nB = nB0 > 0 ? nB0 : 12;
  const per = new Map(); // categorie -> cijfers
  for (const c of D.categories) per.set(c.name, {B:0,W:0,WY:0,BJ:0,W12:0,BR:0,BA:0});
  for (const b of D.budget) { const r = per.get(b.category); if (!r) continue;
    r.BA += budgetSpread(b, P.y1, P.ye) / nB;
    r.B += budgetIn(b, P.p1, P.p2); r.BJ += budgetIn(b, P.y1, P.ye); r.BR += budgetIn(b, Math.max(ref + 1, P.y1), P.ye); }
  let qP=0, qY=0, nP=0, saldoP=0, qCountP=0;
  for (const t of D.transactions) {
    const x = C.res.get(t.id), m = x.m;
    const inP = m >= P.p1 && m <= P.p2, inY = m >= P.y1 && m <= ref;
    if (inP) { nP++; saldoP += t.amount; }
    if (inP && x.q) qCountP++;
    for (const p of x.parts) {
      if (p.cat === "?") { if (inP) qP -= p.amount; if (inY) qY -= p.amount; continue; }
      const r = per.get(p.cat); if (!r) continue;
      if (inP) r.W += p.sign * p.amount; if (inY) r.WY += p.sign * p.amount; if (m >= w1 && m <= ref) r.W12 += p.sign * p.amount;
    }
  }
  for (const c of D.categories) {
    const r = per.get(c.name), g = C.grpByName.get(c.group), sg = g ? g.sign : -1;
    const method = c.forecast || (g ? g.forecast : "begroting");
    r.method = method;
    r.rest = method === "gemiddelde" ? (el > 0 ? r.W12 / el * rem : 0)   // gemiddelde van de afgelopen 12 maanden × resterende maanden
           : r.BR;                                                          // begroting: wat de begroting zegt voor de maanden die nog komen
    r.prog = r.WY + r.rest;
    r.V = sg === 1 ? r.W - r.B : r.B - r.W;
    r.VJ = sg === 1 ? r.prog - r.BJ : r.BJ - r.prog;
    r.AB = r.BA;
  }
  const groups = D.groups.map(g => {
    const cats = D.categories.filter(c => c.group === g.name);
    const s = {B:0,W:0,WY:0,BJ:0,rest:0,prog:0,V:0,VJ:0,AB:0};
    for (const c of cats) { const r = per.get(c.name); for (const k in s) s[k] += r[k]; }
    return {g, cats, s};
  });
  const tot = k => groups.reduce((a, x) => a + (x.g.sign === 1 ? x.s[k] : -x.s[k]), 0);
  const saldo = {B:tot("B"), W:tot("W") - qP, WY:tot("WY") - qY, BJ:tot("BJ"), rest:tot("rest"), prog:tot("prog") - qY};
  saldo.noPct = true; saldo.V = saldo.W - saldo.B;  saldo.VJ = saldo.prog - saldo.BJ;
  saldo.AB = tot("AB");
  const sp = groups.find(x => x.g.savings);
  const spaar = {prog: (sp ? sp.s.prog : 0) + saldo.prog, BJ: (sp ? sp.s.BJ : 0) + saldo.BJ, WY: (sp ? sp.s.WY : 0) + saldo.WY,
    B: (sp ? sp.s.B : 0) + saldo.B, W: (sp ? sp.s.W : 0) + saldo.W};
  spaar.AB = (sp ? sp.s.AB : 0) + saldo.AB;
  return {P, per, groups, saldo, q:{P:qP, Y:qY, n:qCountP}, nP, saldoP, spaar, el, rem, ref};
}

  if (d.bf) { const tr = el.closest("[data-id]"); return tr ? `[data-id=${q(tr.dataset.id)}] [data-bf=${q(d.bf)}]` : null; }

function verloopData(step, r1, r2){
  const C = build();

  if (step === "j") { r1 = Math.floor(r1/12)*12; r2 = Math.floor(r2/12)*12 + 11; }
  const keyOf = m => step === "m" ? m : step === "k" ? Math.floor(m/3) : Math.floor(m/12);
  const dataM = new Set(); for (const t of D.transactions) dataM.add(C.res.get(t.id).m);
  const buckets = [];

    const k = keyOf(m); let b = buckets[buckets.length-1];

    b.m2 = m; b.months.push(m);

    else if (step === "k") { b.label = `kwartaal ${Math.floor((b.m1%12)/3)+1} ${y}`; b.short = `K${Math.floor((b.m1%12)/3)+1} '${yy}`; }

  const saldo = z(), q = z();
  for (const t of D.transactions) {
    const x = C.res.get(t.id), i = idx.get(x.m); if (i == null) continue;

    }
  }
  for (const b of D.budget) { const r = cat.get(b.category); if (!r) continue; buckets.forEach((k, i) => r.B[i] += budgetIn(b, k.m1, k.m2)); }
  const nul = arr => arr.map((v, i) => buckets[i].none ? null : v);
  for (const r of cat.values()) r.W = nul(r.W);

    const W = z(), B = z();
    for (const c of D.categories) if (c.group === g.name) { const r = cat.get(c.name); for (let i = 0; i < N; i++) { W[i] += r.W[i] || 0; B[i] += r.B[i]; } }
    return {g, W: nul(W), B};
  });
  const sp = grp.find(x => x.g.savings);
  const sumBy = (f, k) => buckets.map((_, i) => grp.filter(f).reduce((a, x) => a + (x[k][i] || 0), 0));
  const inkB = sumBy(x => x.g.sign === 1, "B"), lastB = sumBy(x => x.g.sign !== 1 && !x.g.savings, "B");
  const ink = nul(sumBy(x => x.g.sign === 1, "W")), lasten = nul(sumBy(x => x.g.sign !== 1 && !x.g.savings, "W"));

}

/* ---------- Verloop: lijngrafiek (getekend na het opbouwen, op de echte breedte) ---------- */
let LC = [];
function niceTicks(lo, hi, n){

  const st = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const a = Math.floor(lo / st) * st, b = Math.ceil(hi / st) * st, out = [];

}
const axisFmt = v => Math.abs(v) >= 10000 ? nf0.format(Math.round(v/1000)) + "k" : nf0.format(v);

  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / (mobile ? 46 : 58)))));

  if (spec.vline != null) g += `<line x1="${X(spec.vline)}" x2="${X(spec.vline)}" y1="${T}" y2="${T+ph}" stroke="#b9bab5" stroke-dasharray="3 4"/>`;
  const ends = [];

function chartSvg2(RA, RB, LA, LB){

function catOptions(sel, withAuto, autoLabel){
  let h = withAuto ? `<option value="">${esc(autoLabel)}</option>` : `<option value="">– kies –</option>`;
  for (const g of D.groups) {
    const cs = D.categories.filter(c => c.group === g.name); if (!cs.length) continue;
    h += `<optgroup label="${esc(g.name)}">${cs.map(c => `<option ${c.name===sel?"selected":""}>${esc(c.name)}</option>`).join("")}</optgroup>`;
  }
  if (sel && !D.categories.some(c => c.name === sel)) h += `<option selected>${esc(sel)} (bestaat niet meer)</option>`;
  return h;
}
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const dayLabel = iso => { const d = new Date(iso + "T12:00:00"); if (isNaN(d)) return iso; const s = d.toLocaleDateString("nl-NL", {weekday:"long", day:"numeric", month:"long", year:"numeric"}); return s.charAt(0).toUpperCase() + s.slice(1); };
function accountList(){ const s = new Set(D.transactions.map(t => t.account || "")); for (const a of D.accounts) s.add(a.iban); return [...s].sort((a, b) => (a === "") - (b === "") || a.localeCompare(b)); }
const accName = a => a ? (D.accounts.find(x => x.iban === a)?.name || a) : "Contant / handmatig";
const allLabels = () => [...new Set(D.transactions.flatMap(t => t.labels || []))].sort((a, b) => a.localeCompare(b, "nl", {sensitivity:"base"}));
function txList(){
  const C = build(); const P = period();
  let list = D.transactions.slice();
  if (ui.txView === "check") list = list.filter(t => C.res.get(t.id).todo);       // te controleren: uit alle maanden
  else if (ui.txMonth === "periode") list = list.filter(t => { const m = mi(t.date); return m >= P.p1 && m <= P.p2; });
  else if (ui.txMonth.startsWith("r:")) { const [a, b] = ui.txMonth.slice(2).split(":").map(Number); list = list.filter(t => { const m = mi(t.date); return m >= a && m <= b; }); }
  else if (ui.txMonth !== "alle") { const m = +ui.txMonth; list = list.filter(t => mi(t.date) === m); }
  if (ui.txCat === "?") list = list.filter(t => C.res.get(t.id).q);
  else if (ui.txCat.startsWith("g:")) { const g = ui.txCat.slice(2); list = list.filter(t => C.res.get(t.id).parts.some(p => p.group === g)); }
  else if (ui.txCat) list = list.filter(t => C.res.get(t.id).parts.some(p => p.cat === ui.txCat));
  if (ui.txAcc !== "__all") list = list.filter(t => (t.account || "") === ui.txAcc);
  if (ui.txLbl) list = list.filter(t => (t.labels || []).includes(ui.txLbl));
  if (ui.txSearch.trim()) { const s = ui.txSearch.trim().toLowerCase();
    list = list.filter(t => [t.name, t.desc, t.counter, t.note, (t.labels || []).join(" "), eur(t.amount), fmtAmt(Math.abs(t.amount))].join(" ").toLowerCase().includes(s)); }
  list.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
  return list;
}

  return `<div class="card"><div class="row"><h2 style="margin:0">Transacties</h2>

        <option value="alle" ${ui.txMonth==="alle"?"selected":""}>Alle maanden</option>
        ${ui.txMonth.startsWith("r:") ? (([a, b]) => `<option value="${esc(ui.txMonth)}" selected>${esc(rangeLabel(a, b))}</option>`)(ui.txMonth.slice(2).split(":").map(Number)) : ""}

function newDraft(t){
  if (!t) return {id:null, date:todayIso(), amount:"", dir:"af", name:"", note:"", labels:[], manual:"", splits:[], checked:true, account:""};
  return {id:t.id, date:t.date, amount:fmtAmt(Math.abs(t.amount)), dir:t.amount < 0 ? "af" : "bij", name:shopOf(t) || t.counter || "", note:t.note || "",
    labels:[...(t.labels || [])], manual:t.manual || "", splits:(t.splits || []).map(s => ({cat:s.category, amt:fmtAmt(Math.abs(s.amount))})), checked:!t.todo, account:t.account || ""};
}
function splitInfo(d){
  const tot = parseAmt(d.amount); let s = 0, bad = false;
  for (const p of d.splits) { const v = parseAmt(p.amt); if (v === null) { bad = true; continue; } if (v === "") continue; s += Math.abs(v); }
  return {tot: (tot === null || tot === "") ? null : Math.abs(tot), sum: Math.round(s * 100) / 100, bad};
}
function splitRestHtml(d){
  const i = splitInfo(d);
  if (i.tot == null) return `<span class="warn">Vul eerst het bedrag in.</span>`;
  if (i.bad) return `<span class="warn">Een van de bedragen is geen geldig getal.</span>`;
  const r = Math.round((i.tot - i.sum) * 100) / 100;
  if (Math.abs(r) < 0.005) return `<span class="good">✓ Verdeeld: € ${eur(i.sum)} van € ${eur(i.tot)}</span>`;
  return r > 0 ? `<span class="warn">Nog te verdelen: € ${eur(r)}</span> <span class="muted">(verdeeld € ${eur(i.sum)} van € ${eur(i.tot)})</span>`
               : `<span class="warn">€ ${eur(-r)} te veel verdeeld</span> <span class="muted">(verdeeld € ${eur(i.sum)} van € ${eur(i.tot)})</span>`;
}

function setDraft(el){

function openTx(id){
  const t = id ? D.transactions.find(x => x.id === id) : null;
  if (id && !t) return;
  ui.txEdit = t ? t.id : "__new"; ui.draft = newDraft(t); render();
  if (!t) setTimeout(() => $("#dAmt")?.focus(), 0);
}
function closeTx(){ ui.txEdit = null; ui.draft = null; }
function saveDraft(){
  const d = ui.draft; if (!d) return;
  const t0 = d.id ? D.transactions.find(x => x.id === d.id) : null;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || "")) return toast("Vul een geldige datum in.");
  const a = parseAmt(d.amount);
  if (a === null || a === "" || a === 0) return toast("Vul een bedrag in, bijvoorbeeld 12,50.");
  const amount = (d.dir === "bij" ? 1 : -1) * Math.abs(a);
  const name = (d.name || "").trim();
  if (!t0 && !name) return toast("Vul een naam in.");
  let splits = null;
  if (d.splits.length >= 2) {
    if (d.splits.some(s => !s.cat)) return toast("Kies bij elk deel een categorie.");
    if (d.splits.some(s => { const v = parseAmt(s.amt); return v === null || v === "" || v === 0; })) return toast("Vul bij elk deel een bedrag in.");
    const i = splitInfo(d);
    if (Math.abs(i.sum - Math.abs(amount)) > 0.005) return toast(`De delen tellen op tot € ${eur(i.sum)}, maar het bedrag is € ${eur(Math.abs(amount))}.`);
    splits = d.splits.map(s => ({category:s.cat, amount:Math.abs(parseAmt(s.amt))}));
  }
  let t = t0;
  if (!t) {
    t = {id:uid("m"), source:"manual", account:d.account || "", date:d.date, counter:"", name, amount, code:"", type:"", seq:"", ref:"", desc:"", snsCat:"", manual:""};
    D.transactions.push(t);
  } else {
    const nameNow = shopOf(t);
    const bankChanged = t.source !== "manual" && (t.date !== d.date || Math.abs(t.amount - amount) > 0.004 || (name && name !== nameNow));
    if (bankChanged && !t.orig) t.orig = {date:t.date, amount:t.amount, name:t.name || ""};
    t.date = d.date; t.amount = amount;
    if (name && name !== nameNow) t.name = name;
    if (t.source === "manual") t.account = d.account || "";
    if (t.orig && t.date === t.orig.date && Math.abs(t.amount - t.orig.amount) < 0.005 && (t.name || "") === (t.orig.name || "")) delete t.orig;
  }
  t.manual = splits ? "" : (d.manual || "");
  if (splits) t.splits = splits; else delete t.splits;
  const note = (d.note || "").trim(); if (note) t.note = note; else delete t.note;
  if (d.labels.length) t.labels = d.labels.slice(); else delete t.labels;
  if (d.checked) delete t.todo; else t.todo = true;
  closeTx(); changed(); toast(t0 ? "Transactie bijgewerkt." : "Transactie toegevoegd.");
}
async function deleteTx(){

}

document.addEventListener("change", ev => {

    if (f === "name") { const n = el.value.trim();
      if (!n || (n !== g.name && D.groups.some(x => x.name === n))) { toast(n ? "Die groep bestaat al." : "Naam mag niet leeg zijn."); el.value = g.name; return; }

    else if (f === "savings") { for (const x of D.groups) x.savings = x.id === g.id; }
    else g[f] = el.value;

function changed(rerender = true){ invalidate(); setDirty(true); if (rerender) render(); }

function renameCategory(c, n, el){
  if (!n) { el.value = c.name; return; }
  if (n !== c.name && D.categories.some(x => x.name === n)) { toast("Die categorie bestaat al."); el.value = c.name; return; }
  const old = c.name; c.name = n;
  for (const b of D.budget) if (b.category === old) b.category = n;
  for (const r of [...D.rules.words, ...D.rules.names, ...D.rules.sns]) if (r.category === old) r.category = n;
  for (const t of [...D.transactions, ...D.deleted]) { if (t.manual === old) t.manual = n; for (const s of t.splits || []) if (s.category === old) s.category = n; }
  changed(); toast(`Hernoemd naar '${n}' – overal aangepast.`);
}
async function deleteGroup(id){
  const g = D.groups.find(x => x.id === id); const cats = D.categories.filter(c => c.group === g.name);
  if (D.groups.length < 2) { toast("Er moet minstens één groep blijven."); return; }
  if (cats.length) {
    const target = await choiceDlg(`In '${g.name}' staan nog ${cats.length} categorie(ën). Naar welke groep moeten die?`, D.groups.filter(x => x.id !== id).map(x => x.name), "Verplaats en verwijder");
    if (!target) return; for (const c of cats) c.group = target;
  } else if (!await confirmDlg(`Groep '${g.name}' verwijderen?`, "Verwijder")) return;
  const wasSav = g.savings; D.groups = D.groups.filter(x => x.id !== id);
  if (wasSav) { const sp = D.groups.find(x => x.name === "Sparen"); if (sp) sp.savings = true; }
  changed();

async function deleteCategory(id){

}

/* ---------- CSV-import ---------- */
function parseCsv(text){
  const rows = []; let row = [], f = "", q = false;
  const sep = (text.split("\n")[0].match(/;/g)||[]).length >= (text.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
async function readText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("\uFFFD")) t = new TextDecoder("windows-1252").decode(buf);
  return t.replace(/^﻿/, "");
}
function snsRows(text){
  const rows = parseCsv(text); if (!rows.length) throw new Error("Leeg bestand.");
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = n => h.indexOf(n);
  const need = ["datum","je rekening","van / naar","naam","bedrag bij / af","omschrijving"];
  for (const n of need) if (col(n) < 0) throw new Error(`Dit lijkt geen SNS-export: kolom '${n}' ontbreekt.`);
  const g = (r, n) => { const i = col(n); return i >= 0 ? (r[i] ?? "").trim() : ""; };
  const dt = s => { const m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m2 ? m2[0] : ""; };
  const num = s => { s = s.replace(/\s/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); return parseFloat(s) || 0; };
  return rows.slice(1).map(r => {
    const acc = g(r, "je rekening"), seq = g(r, "volgnummer"), date = dt(g(r, "datum")), amount = num(g(r, "bedrag bij / af")), desc = g(r, "omschrijving");
    const id = seq ? `${acc}|${seq}` : `${acc}|${date}|${amount}|${desc.slice(0,60)}`;
    return {id, account:acc, date, counter:g(r,"van / naar"), name:g(r,"naam"), amount, code:g(r,"code"), type:g(r,"type"), seq,
      ref:g(r,"betalingskenmerk"), desc, snsCat:g(r,"categorie"), manual:""};
  }).filter(t => t.date);
}
async function importFiles(files){

  const byM = new Map(); for (const t of all) { const m = mi(t.date); const x = byM.get(m) || {all:0, fresh:0}; x.all++; byM.set(m, x); }
  for (const t of fresh) byM.get(mi(t.date)).fresh++;
  const months = [...byM.keys()].sort((a,b)=>a-b);
  const m = back => { const upd = () => { let n = 0; back.querySelectorAll("[data-m]:checked").forEach(c => n += byM.get(+c.dataset.m).fresh); back.querySelector("#impN").textContent = n; };
    back.querySelectorAll("[data-m]").forEach(c => c.onchange = upd);

    back.querySelector("#impNone").onclick = () => { back.querySelectorAll("[data-m]").forEach(c => c.checked = false); upd(); }; upd(); };
  m.result = back => [...back.querySelectorAll("[data-m]:checked")].map(c => +c.dataset.m);
  const pick = await dialog(`<h3>Importeren</h3><p class="small muted" style="margin-top:0">${all.length} transacties gevonden, waarvan ${fresh.length} nieuw (de rest staat er al in of heb je verwijderd). Kies welke maanden je wilt importeren.</p>
    <div class="row small"><button class="btn sm" id="impAll">alles</button><button class="btn sm" id="impNone">niets</button></div>
    <div style="columns:2;margin-top:6px">${months.map(mm => { const x = byM.get(mm); return `<div><label class="chk"><input type="checkbox" data-m="${mm}" ${x.fresh?"checked":"disabled"}> ${esc(miName(mm))} <span class="small muted">${x.fresh} nieuw${x.all-x.fresh?` · ${x.all-x.fresh} al aanwezig of verwijderd`:""}</span></label></div>`; }).join("")}</div>
    <div class="actions"><button class="btn" data-r="cancel">Annuleer</button><button class="btn primary" data-r="ok">Importeer <span id="impN">0</span> transacties</button></div>`, m);
  if (!pick || !pick.length) return;
  const set = new Set(pick); const add = fresh.filter(t => set.has(mi(t.date)));
  for (const t of add) t.todo = true;                                          // nieuw = nog te controleren
  D.transactions.push(...add);
  for (const t of add) if (t.account && !D.accounts.some(a => a.iban === t.account)) D.accounts.push({iban:t.account, name:t.account});
  invalidate(); setDirty(true);
  const q = add.filter(t => cl(t).cat === "?").length;
  ui.p1 = ui.p2 = build().last; ui.txMonth = "periode"; ui.txView = "check"; ui.txCat = ""; ui.txAcc = "__all"; ui.txLbl = ""; ui.txSearch = ""; ui.txSel.clear(); closeTx(); view = "transacties"; render();
  toast(`${add.length} transacties geïmporteerd${q ? ` – ${q} nog in te delen` : ""}.`);
}

function exportCsv(kind){

  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  let rows = [], name = "";
  if (kind === "tx") { const C = build(); name = "transacties.csv";
    rows.push(["Datum","Rekening","Van / naar","Naam / winkel","Bedrag","Categorie","Groep","Herkend via","Omschrijving","Volgnummer","Notitie","Labels"]);
    for (const t of D.transactions.slice().sort((a,b)=>a.date<b.date?-1:1)) { const x = C.res.get(t.id);
      for (const p of x.parts) rows.push([fmtDate(t.date), t.account, t.counter, shopOf(t), n(p.amount), p.cat, p.group, x.via, t.desc, t.seq, t.note || "", (t.labels || []).join(", ")]); } }
  else if (kind === "bud") { name = "begroting.csv"; const C = build();
    rows.push(["Naam","Categorie","Groep","Bedrag","Frequentie","Startdatum","Einddatum","Status","Per maand","Notitie"]);
    for (const b of D.budget) rows.push([b.name, b.category, C.catByName.get(b.category)?.group || "?", n(+b.amount||0), b.freq, fmtDate(b.start), fmtDate(b.end), STATUS_LABEL[budgetStatus(b)], b.freq==="eenmalig"?"":n((+b.amount||0)*(FAC[b.freq]??0)), b.note]); }
  else { const R = compute(), P = R.P, Y = Math.floor(P.y1/12), per = esc(miName(P.p1)) + (P.p2 !== P.p1 ? " t/m " + miName(P.p2) : "");
    name = `vergelijk ${per.replace(/ /g, "-")}.csv`;
    const pc = (w, b) => b ? Math.round(w / b * 100) + "%" : "";
    rows.push(["", "", `Per maand ${Y}`, per, "", "", "", `Jaar ${Y} (werkelijk t/m ${miName(R.ref)})`, "", "", ""]);
    rows.push(["Groep","Categorie","Begroot per maand","Begroot","Werkelijk","Verschil","%","Begroot jaar","Werkelijk t/m nu","Prognose","Verschil jaar"]);
    const line = (g, c, x, noPct) => [g, c, n(x.AB), n(x.B), n(x.W), n(x.V), noPct ? "" : pc(x.W, x.B), n(x.BJ), n(x.WY), n(x.prog), n(x.VJ)];
    for (const x of R.groups) { for (const c of x.cats) rows.push(line(x.g.name, c.name, R.per.get(c.name))); rows.push(line(x.g.name, "Totaal", x.s)); }
    rows.push(["", "Niet ingedeeld (?)", "", "", n(R.q.P), "", "", "", n(R.q.Y), n(R.q.Y), ""]);
    rows.push(line("", "Saldo", R.saldo, true));
    const sp = R.spaar; rows.push(["", "Gespaard (sparen + saldo)", n(sp.AB), n(sp.B), n(sp.W), n(sp.W - sp.B), sp.B > 0 ? pc(sp.W, sp.B) : "", n(sp.BJ), n(sp.WY), n(sp.prog), n(sp.prog - sp.BJ)]); }
  download(name, "﻿" + rows.map(r => r.map(q).join(";")).join("\r\n"), "text/csv;charset=utf-8");
}
let dlCap;
async function getDl(){
  if (dlCap !== undefined) return dlCap;
  try { dlCap = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("downloads") : null; } catch(e) { dlCap = null; }
  return dlCap;
}
async function download(name, text, type){
  const cap = await getDl();
  if (cap) { try { await cap.save({filename:name, data:text}); return true; } catch(e) { toast("Opslaan is geannuleerd of niet gelukt."); return false; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

/* ---------- bestand openen / bewaren ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function serialize(){
  const json = JSON.stringify(D);
  if (!password) return JSON.stringify(D, null, 1);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await keyFrom(password, salt);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(json));
  let s = ""; const u = new Uint8Array(ct); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return JSON.stringify({app:"begroting", encrypted:true, v:1, salt:b64(salt), iv:b64(iv), data:btoa(s)});
}
async function deserialize(text){
  let o; try { o = JSON.parse(text); } catch(e) { throw new Error("Dit is geen geldig gegevensbestand."); }
  if (o.encrypted) {
    if (!crypto?.subtle) throw new Error("Deze browser kan versleutelde bestanden niet openen.");
    for (let tries = 0; tries < 5; tries++) {
      const pw = await askPassword("Dit bestand is beveiligd", false); if (!pw) throw new Error("cancel");
      try { const key = await keyFrom(pw, unb64(o.salt));
        const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(o.iv)}, key, unb64(o.data));
        password = pw; return normalize(JSON.parse(new TextDecoder().decode(pt))); }
      catch(e) { toast("Onjuist wachtwoord."); }
    }
    throw new Error("cancel");
  }
  if (o.app !== "begroting") throw new Error("Dit is geen gegevensbestand van dit programma.");
  password = null; return normalize(o);
}
async function openFile(file, handle = null){
  if (dirty && D && !await confirmDlg("Je hebt wijzigingen die nog niet zijn bewaard. Toch een ander bestand openen?", "Openen")) return;
  try { const d = await deserialize(await file.text()); D = d; fileName = file.name; fileHandle = handle; ui.p1 = ui.p2 = ui.q1 = ui.q2 = undefined; closeTx(); ui.txSel.clear(); invalidate(); setDirty(false); safetyCopy(true); view = "vergelijk"; navReset(); render(); toast("Bestand geopend."); }
  catch(e) { if (e.message !== "cancel") dialog(`<h3>Openen lukt niet</h3><p>${esc(e.message)}</p><div class="actions"><button class="btn primary" data-r="ok">OK</button></div>`); }
}
async function save(as){
  const text = await serialize();
  const suggested = fileName || "begroting-gegevens.json";
  if ("showSaveFilePicker" in window) {
    try {
      if (!fileHandle || as) fileHandle = await window.showSaveFilePicker({suggestedName: suggested, types:[{description:"Begrotingsgegevens", accept:{"application/json":[".json"]}}]});
      const w = await fileHandle.createWritable(); await w.write(text); await w.close();
      fileName = fileHandle.name; setDirty(false); safetyCopy(true); render(); toast("Bewaard."); return;
    } catch(e) { if (e.name === "AbortError") return; fileHandle = null; }
  }
  if (!await download(suggested, text, "application/json")) return;
  fileName = suggested; setDirty(false); safetyCopy(true); render();
  toast("Bewaard als download – vervang je oude bestand door deze nieuwe versie.");
}
let safetyTimer = null;
function safetyCopy(now){
  clearTimeout(safetyTimer);
  const go = async () => { if (!D) return; try { localStorage.setItem(LS_KEY, JSON.stringify({when:new Date().toLocaleString("nl-NL"), name:fileName, blob: await serialize()})); } catch(e) {} };
  if (now) go(); else safetyTimer = setTimeout(go, 800);
}
async function recover(){
  try { const rec = JSON.parse(localStorage.getItem(LS_KEY)); const d = await deserialize(rec.blob); D = d; fileName = rec.name || ""; fileHandle = null; invalidate(); setDirty(true); render();
    toast("Veiligheidskopie geladen – vergeet niet te bewaren."); }
  catch(e) { if (e.message !== "cancel") toast("De veiligheidskopie kon niet worden geladen."); }
}
function dropZone(el, cb){
  if (!el) return;
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over"); if (e.dataTransfer.files.length) cb([...e.dataTransfer.files]); });
}
$("#saveBtn").onclick = () => save(false);
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s" && D) { e.preventDefault(); save(false); return; }
  if (e.key === "Enter" && e.target && e.target.id === "dLbl") { e.preventDefault(); $("[data-act=lbladd]")?.click(); return; }
  if (e.key === "Escape" && D && ui.txEdit && view === "transacties" && !document.querySelector(".back")) { closeTx(); render(); }
});

render();
