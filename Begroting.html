<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Begroting & boekhouding</title>
<style>
:root{
  --teal:#1F4E5A; --teal2:#2c6474; --bg:#f5f6f4; --card:#fff; --ink:#1d2326; --ink2:#52514e; --muted:#8a8a86;
  --line:#e2e3df; --warn:#b4471c; --good:#2e7d32; --bad:#c00000; --in:#fff7dd;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal2)}
.hidden{display:none!important}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
header.top .file{font-size:12px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
header.top .dirty{font-size:12px;background:#f2b84b;color:#3a2a00;border-radius:20px;padding:2px 9px;white-space:nowrap}
header.top button{background:#fff;color:var(--teal);border:0;border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
nav.tabs{position:sticky;top:48px;z-index:15;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px;color:var(--ink2);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
nav.tabs .sh{display:none}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1500px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px;color:var(--teal)}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12px} .warn{color:var(--warn);font-weight:600} .good{color:var(--good)} .bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:600}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px;font-weight:500}
.icon{border:0;background:none;padding:2px 6px;color:var(--muted);font-size:15px}
.icon:hover{color:var(--ink)}
select,input[type=text],input[type=number],input[type=date],input[type=password],input[type=search]{border:1px solid #cfd1cc;border-radius:7px;padding:6px 8px;background:#fff;min-width:0}
input.in,select.in{background:var(--in)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st-actief{background:#c8e6c9;color:#1b5e20}.st-gestopt{background:#f8c9c4;color:#b71c1c}.st-toekomst{background:#e3e8f0;color:#3b5b8c}
.via{font-size:11px;color:var(--muted)}
.qmark{background:#f9d6cc;color:var(--warn);font-weight:700}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;text-align:left;vertical-align:middle;border-bottom:1px solid #eeefeb}
th{font-size:12px;color:#fff;background:var(--teal);font-weight:600;white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{color:#fff;font-weight:700;font-size:13px;letter-spacing:.3px}
tr.tot td{font-weight:700;border-top:2px solid currentColor}
tr.saldo td{font-weight:700;background:#dce6e8;border-top:2px solid var(--teal)}
tr.click{cursor:pointer} tr.click:hover td{background:#f2f6f7}
td.gap,th.gap{width:14px;padding:0;background:transparent!important;border:0}
.secsw{display:none}
.cmp th.sh{background:#fff;color:var(--teal);font-size:13px;border-bottom:0}

/* forms in lists */
.list input[type=text],.list input[type=number],.list input[type=date],.list select{width:100%}
.list td{padding:3px 4px}

/* dialogs */
.back{position:fixed;inset:0;background:rgba(20,30,35,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{font-size:17px;color:var(--teal)}
.dlg .row{margin:8px 0}
.dlg label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 3px}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.drop{border:2px dashed #b9c4c6;border-radius:12px;padding:22px;text-align:center;color:var(--ink2);background:#fafbfa}
.drop.over{border-color:var(--teal);background:#eef5f6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:60;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}

/* start */
.start{max-width:620px;margin:40px auto;text-align:center}
.start .card{text-align:left}

/* transactions as cards on mobile */
.txcards{display:none}
.txc{border-bottom:1px solid var(--line);padding:9px 2px}
.txc .l1{display:flex;gap:8px;align-items:baseline}
.txc .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txc .am{font-variant-numeric:tabular-nums;font-weight:600}
.txc .l2{display:flex;gap:8px;align-items:center;margin-top:4px}
.txc select{flex:1}
.desc{font-size:11px;color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chart{width:100%;max-width:640px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--ink2)}
.help{background:#eef5f6;border-left:4px solid var(--teal2);padding:10px 12px;border-radius:6px;color:#24434b;margin-bottom:12px}
.help ol{margin:4px 0 0;padding-left:20px}

@media (max-width:820px){
  header.top h1{display:none}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom)}
  nav.tabs button{border-bottom:0;border-top:3px solid transparent;padding:10px 4px;font-size:11px}
  nav.tabs .lg{display:none} nav.tabs .sh{display:inline}
  nav.tabs .badge{margin-left:2px;min-width:15px;line-height:15px;font-size:10px;padding:0 3px}
  nav.tabs button.on{border-top-color:var(--teal)}
  main{padding:10px 8px 90px}
  .card{padding:12px}
  .secsw{display:flex}
  .cmp .sec-y,.cmp .sec-f{display:none}
  .cmp.show-y .sec-p,.cmp.show-f .sec-p{display:none}
  .cmp.show-y .sec-y{display:table-cell}
  .cmp.show-f .sec-f{display:table-cell}
  .cmp td.gap,.cmp th.gap{display:none}
  .txtable{display:none}
  .txcards{display:block}
  th,td{padding:5px 5px}
}
</style>
</head>
<body>
<header class="top">
  <h1>Begroting & boekhouding</h1>
  <span class="file" id="fileName"></span>
  <span class="dirty hidden" id="dirty">● niet bewaard</span>
  <button id="saveBtn" class="hidden">Bewaar</button>
</header>
<nav class="tabs hidden" id="tabs"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileOpen" accept=".json,.begroting,application/json" class="hidden">
<input type="file" id="csvOpen" accept=".csv,text/csv" multiple class="hidden">

<script>
"use strict";
/* =====================================================================
   Begroting & boekhouding – draait volledig in de browser.
   Gegevens blijven op je eigen apparaat: in het gegevensbestand dat je zelf bewaart
   (plus een veiligheidskopie in deze browser).
   ===================================================================== */

const APPV = 1;
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const FREQS = ["maand","kwartaal","halfjaar","jaar","eenmalig"];
const FAC = {maand:1,kwartaal:1/3,halfjaar:1/6,jaar:1/12,eenmalig:0};
const LS_KEY = "begroting.veiligheidskopie.v1";

let D = null;            // alle gegevens
let fileHandle = null;   // bestand (alleen Chrome/Edge)
let fileName = "";
let password = null;     // alleen in geheugen
let dirty = false;
let view = "vergelijk";
let ui = {cmpSec:"p", txMonth:"periode", txCat:"", txSearch:"", txOnlyQ:false, budSort:"categorie", budOnlyActive:false, showEmpty:true};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const nf2 = new Intl.NumberFormat("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("nl-NL",{maximumFractionDigits:0});
const eur = v => (v === "" || v == null || isNaN(v)) ? "" : nf2.format(Math.abs(v) < 0.005 ? 0 : v);
const eur0 = v => (v === "" || v == null || isNaN(v)) ? "" : nf0.format(Math.abs(v) < 0.5 ? 0 : v);
const pct = v => (v === "" || v == null || !isFinite(v)) ? "" : Math.round(v*100) + "%";
const mi = iso => iso ? (parseInt(iso.slice(0,4))*12 + parseInt(iso.slice(5,7)) - 1) : null;   // maandnummer
const miName = m => MAANDEN[((m%12)+12)%12] + " " + Math.floor(m/12);
const todayMi = () => { const d = new Date(); return d.getFullYear()*12 + d.getMonth(); };
const fmtDate = iso => iso ? `${iso.slice(8,10)}-${iso.slice(5,7)}-${iso.slice(0,4)}` : "";
const cls = v => v > 0.004 ? "good" : (v < -0.004 ? "bad" : "");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }
function setDirty(v=true){ dirty=v; $("#dirty").classList.toggle("hidden",!v); if(v) safetyCopy(); }

/* ---------- standaard (leeg) bestand ---------- */
function emptyData(){
  const groups = [
    {name:"Inkomsten",color:"2E7D32",light:"E8F3E9",forecast:"begroting",sign:1},
    {name:"Vaste lasten",color:"2A5DA8",light:"E7EEF8",forecast:"begroting",sign:-1},
    {name:"Variabele lasten",color:"C0612B",light:"FBEDE4",forecast:"gemiddelde",sign:-1},
    {name:"Sparen",color:"6A4FA3",light:"EFEAF7",forecast:"begroting",sign:-1},
    {name:"Uitgaven",color:"7A7A7A",light:"EFEFEF",forecast:"gemiddelde",sign:-1}];
  const c = [["Salaris","Inkomsten"],["Toeslagen & subsidies","Inkomsten"],["Overige inkomsten","Inkomsten"],
    ["Wonen","Vaste lasten"],["Energie & water","Vaste lasten"],["Verzekeringen","Vaste lasten"],["Telefoon & internet","Vaste lasten"],["Abonnementen","Vaste lasten"],["Auto","Vaste lasten"],["Bankkosten","Vaste lasten"],
    ["Boodschappen","Variabele lasten"],["Brandstof","Variabele lasten"],["Horeca & uitgaan","Variabele lasten"],["Kleding","Variabele lasten"],["Persoonlijke verzorging","Variabele lasten"],["Gezondheid","Variabele lasten"],["Huis & tuin","Variabele lasten"],["Cadeaus","Variabele lasten"],["Reizen & vakantie","Variabele lasten"],["Vervoer & parkeren","Variabele lasten"],
    ["Sparen","Sparen"],["Zakgeld","Uitgaven"],["Contant geld","Uitgaven"],["Overige uitgaven","Uitgaven"]];
  return {app:"begroting",version:APPV,groups,categories:c.map(([n,g],i)=>({id:"c"+(i+1),name:n,group:g,forecast:"",note:""})),
    budget:[],rules:{words:[],names:[],sns:[{id:"s1",sns:"Boodschappen",category:"Boodschappen"},{id:"s2",sns:"Kleding",category:"Kleding"},{id:"s3",sns:"Eten & drinken",category:"Horeca & uitgaan"},{id:"s4",sns:"Contanten",category:"Contant geld"}]},
    accounts:[],transactions:[]};
}
function lighten(hex){ const n = parseInt(hex, 16); const mix = c => Math.round(c + (255 - c) * 0.88);
  const r = mix(n >> 16 & 255), g = mix(n >> 8 & 255), b = mix(n & 255); return ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase(); }
function normalize(d){
  d.groups ||= emptyData().groups; d.categories ||= []; d.budget ||= []; d.rules ||= {};
  d.rules.words ||= []; d.rules.names ||= []; d.rules.sns ||= []; d.accounts ||= []; d.transactions ||= [];
  for (const g of d.groups) { g.id ||= uid("g"); g.sign = g.sign === 1 ? 1 : -1; g.forecast ||= "begroting"; g.color ||= "7A7A7A"; g.light ||= lighten(g.color); }
  if (!d.groups.some(g => g.savings)) { const sp = d.groups.find(g => g.name === "Sparen"); if (sp) sp.savings = true; }
  for (const c of d.categories) { c.id ||= uid("c"); c.forecast ||= ""; c.note ||= ""; }
  for (const b of d.budget) { b.id ||= uid("b"); }
  for (const r of [...d.rules.words, ...d.rules.names, ...d.rules.sns]) r.id ||= uid("r");
  return d;
}

/* ---------- indelen (zelfde logica als in Numbers) ---------- */
let CACHE = null;
function invalidate(){ CACHE = null; }
const sq = s => String(s||"").replace(/\s+/g," ").trim();
function shopOf(t){ if (t.name && t.name.trim()) return sq(t.name); const i=(t.desc||"").indexOf(">"); return i>=0 ? sq(t.desc.slice(0,i)) : ""; }
function firstWord(s){ let x=s||""; const st=x.indexOf("*"); if(st>=0) x=x.slice(st+1).trim(); const sp=x.indexOf(" "); return sp>=0 ? x.slice(0,sp) : x; }
function build(){
  if (CACHE) return CACHE;
  const catByName = new Map(D.categories.map(c => [c.name, c]));
  const grpByName = new Map(D.groups.map(g => [g.name, g]));
  const nameMap = new Map();
  for (const r of D.rules.names) { if(!r.key) continue; const k = sq(r.key).toLowerCase() + (r.dir ? "|"+r.dir : ""); if(!nameMap.has(k)) nameMap.set(k, r); }
  const snsMap = new Map();
  for (const r of D.rules.sns) { if(!r.sns) continue; const k=r.sns.trim().toLowerCase(); if(!snsMap.has(k)) snsMap.set(k, r); }
  const valid = n => catByName.has(n) ? n : "?";
  const res = new Map(); const ruleHits = new Map();
  for (const t of D.transactions) {
    const dir = t.amount < 0 ? "af" : "bij";
    let auto="?", avia="niet herkend", rule=null;
    const text = ((t.name||"") + " " + (t.desc||"")).toLowerCase();
    let best = 0;
    for (const w of D.rules.words) {
      const wt = (w.text||"").trim().toLowerCase();
      if (!wt || (w.dir && w.dir !== dir)) continue;
      if (wt.length > best && text.includes(wt)) { rule=w; avia="zoekwoord"; best = wt.length; }
    }
    if (!rule) {
      const shop = shopOf(t);
      for (const k of [shop, firstWord(shop), t.counter]) {
        if (!k) continue; const kk = k.toLowerCase();
        const r = nameMap.get(kk+"|"+dir) || nameMap.get(kk);
        if (r) { rule=r; avia="naam/winkel/IBAN"; break; }
      }
    }
    if (!rule && t.snsCat) { const r = snsMap.get(t.snsCat.trim().toLowerCase()); if (r) { rule=r; avia="SNS-categorie"; } }
    if (rule) auto = valid(rule.category);
    let cat = auto, via = avia;
    if (t.manual) { cat = valid(t.manual); via = "handmatig"; }
    else if (rule) ruleHits.set(rule.id, (ruleHits.get(rule.id)||0)+1);
    const c = catByName.get(cat); const g = c ? grpByName.get(c.group) : null;
    res.set(t.id, {cat, via, auto, rule, group: g ? g.name : "?", sign: g ? g.sign : -1, m: mi(t.date)});
  }
  let first = Infinity, last = -Infinity;
  for (const t of D.transactions) { const m = mi(t.date); if (m < first) first = m; if (m > last) last = m; }
  CACHE = {res, ruleHits, catByName, grpByName, first, last};
  return CACHE;
}
const cl = t => build().res.get(t.id);

/* ---------- begroting ---------- */
function budgetIn(b, lo, hi){
  const amt = +b.amount || 0; if (!b.category || !amt || hi < lo) return 0;
  const s = b.start ? mi(b.start) : -Infinity, e = b.end ? mi(b.end) : Infinity;
  if (b.freq === "eenmalig") return (s >= lo && s <= hi) ? amt : 0;
  const n = Math.max(0, Math.min(e, hi) - Math.max(s, lo) + 1);
  return amt * (FAC[b.freq] ?? 0) * n;
}
function budgetStatus(b){
  const cur = todayMi(); const s = b.start ? mi(b.start) : -Infinity, e = b.end ? mi(b.end) : Infinity;
  if (s > cur) return "toekomst"; return e >= cur ? "actief" : "gestopt";
}
const STATUS_LABEL = {actief:"actief",gestopt:"gestopt",toekomst:"nog niet begonnen"};

/* ---------- periode ---------- */
function defaultPeriod(){
  const c = build(); const m = isFinite(c.last) ? c.last : todayMi();
  return {p1:m, p2:m};
}
function period(){
  ui.p1 ??= defaultPeriod().p1; ui.p2 ??= ui.p1;
  const p1 = ui.p1, p2 = ui.p2 ?? ui.p1;
  const y1 = Math.floor(p2/12)*12, ye = y1+11;
  return {p1, p2, y1, ye, ok: p2 >= p1};
}

/* ---------- berekening Vergelijk ---------- */
function compute(){
  const P = period(), C = build(), cur = todayMi();
  const el = Math.max(0, Math.min(P.p2, cur) - Math.max(P.y1, C.first) + 1);
  const rem = Math.max(0, P.ye - Math.max(Math.min(P.p2, cur), P.y1 - 1));
  const per = new Map(); // categorie -> cijfers
  for (const c of D.categories) per.set(c.name, {B:0,W:0,BY:0,WY:0,BJ:0});
  for (const b of D.budget) { const r = per.get(b.category); if (!r) continue;
    r.B += budgetIn(b, P.p1, P.p2); r.BY += budgetIn(b, P.y1, P.p2); r.BJ += budgetIn(b, P.y1, P.ye); }
  let qP=0, qY=0, nP=0, saldoP=0, qCountP=0;
  for (const t of D.transactions) {
    const x = C.res.get(t.id), m = x.m;
    const inP = m >= P.p1 && m <= P.p2, inY = m >= P.y1 && m <= P.p2;
    if (inP) { nP++; saldoP += t.amount; }
    if (x.cat === "?") { if (inP) { qP -= t.amount; qCountP++; } if (inY) qY -= t.amount; continue; }
    const r = per.get(x.cat); if (!r) continue;
    if (inP) r.W += x.sign * t.amount; if (inY) r.WY += x.sign * t.amount;
  }
  for (const c of D.categories) {
    const r = per.get(c.name), g = C.grpByName.get(c.group), sg = g ? g.sign : -1;
    const method = c.forecast || (g ? g.forecast : "begroting");
    r.method = method;
    r.rest = method === "gemiddelde" ? (el > 0 ? r.WY / el * rem : 0) : Math.max(0, r.BJ - Math.max(0, r.WY));
    r.prog = r.WY + r.rest;
    r.V = sg === 1 ? r.W - r.B : r.B - r.W;
    r.VY = sg === 1 ? r.WY - r.BY : r.BY - r.WY;
    r.VJ = sg === 1 ? r.prog - r.BJ : r.BJ - r.prog;
  }
  const groups = D.groups.map(g => {
    const cats = D.categories.filter(c => c.group === g.name);
    const s = {B:0,W:0,BY:0,WY:0,BJ:0,rest:0,prog:0,V:0,VY:0,VJ:0};
    for (const c of cats) { const r = per.get(c.name); for (const k in s) s[k] += r[k]; }
    return {g, cats, s};
  });
  const tot = k => groups.reduce((a, x) => a + (x.g.sign === 1 ? x.s[k] : -x.s[k]), 0);
  const saldo = {B:tot("B"), W:tot("W") - qP, BY:tot("BY"), WY:tot("WY") - qY, BJ:tot("BJ"), rest:tot("rest"), prog:tot("prog") - qY};
  saldo.noPct = true; saldo.V = saldo.W - saldo.B; saldo.VY = saldo.WY - saldo.BY; saldo.VJ = saldo.prog - saldo.BJ;
  const sp = groups.find(x => x.g.savings);
  const spaar = {prog: (sp ? sp.s.prog : 0) + saldo.prog, BJ: (sp ? sp.s.BJ : 0) + saldo.BJ};
  return {P, per, groups, saldo, q:{P:qP, Y:qY, n:qCountP}, nP, saldoP, spaar, el, rem};
}

/* =====================================================================
   Weergave
   ===================================================================== */
const TABS = [["vergelijk","Vergelijk","Vergelijk"],["transacties","Transacties","Transacties"],["begroting","Begroting","Begroting"],["regels","Regels","Regels"],["categorieen","Categorieën","Categ."],["abonnementen","Abonnementen","Abo's"],["bestand","Bestand","Bestand"]];
function renderTabs(){

  $("#tabs").innerHTML = TABS.map(([k,l,sh]) => `<button data-tab="${k}" class="${view===k?"on":""}"><span class="lg">${l}</span><span class="sh">${sh}</span>${k==="transacties"&&q?`<span class="badge">${q}</span>`:""}</button>`).join("");

function render(){

/* focus terugzetten na opnieuw tekenen (bijv. als een rij door sorteren verschuift) */
function focusKey(el){
  if (!el || !el.closest || !el.closest("#main")) return null;
  const d = el.dataset || {}, q = v => `"${CSS.escape(v)}"`;
  if (d.bf) { const tr = el.closest("tr[data-id]"); return tr ? `tr[data-id=${q(tr.dataset.id)}] [data-bf=${q(d.bf)}]` : null; }
  for (const k of ["rf","cf"]) if (d[k] && d.id) return `[data-${k}=${q(d[k])}][data-id=${q(d.id)}]`;
  if (d.gf && d.gid) return `[data-gf=${q(d.gf)}][data-gid=${q(d.gid)}]`;
  if (d.act && d.id) return `[data-act=${q(d.act)}][data-id=${q(d.id)}]`;
  return el.id ? `#${CSS.escape(el.id)}` : null;
}
/* opnieuw tekenen pas als de muis/vinger los is, zodat een klik op een knop niet verloren gaat */
let pointerDown = false, pendingRender = false;
document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
document.addEventListener("pointerup", () => { pointerDown = false; if (pendingRender) setTimeout(flushRender, 0); }, true);
document.addEventListener("pointercancel", () => { pointerDown = false; if (pendingRender) setTimeout(flushRender, 0); }, true);
function flushRender(){ if (!pendingRender) return; pendingRender = false; render(); }
function laterRender(el){
  pendingRender = true;
  if (pointerDown && el && el.tagName !== "SELECT") { setTimeout(flushRender, 600); return; }   // wacht op loslaten, maar nooit langer dan 0,6 s
  setTimeout(flushRender, 0);
}
/* tekstvakken in Begroting en Regels: bij elke toets bewaren, bij het verlaten van het vak opnieuw sorteren
   (iPhone-Safari stuurt niet altijd een 'change' als je naar een ander vak tikt) */
let fieldEdited = null;
function setField(el){
  if (el.dataset.bf) { const tr = el.closest("tr"); const b = tr && D.budget.find(b => b.id === tr.dataset.id); if (!b) return false;
    b[el.dataset.bf] = el.dataset.bf === "amount" ? (el.value === "" ? "" : +el.value) : el.value; return true; }
  if (el.dataset.rf) { const r = D.rules[el.dataset.kind]?.find(r => r.id === el.dataset.id); if (!r) return false; r[el.dataset.rf] = el.value; return true; }
  return false;
}
document.addEventListener("input", ev => {
  const el = ev.target; if (!D || el.tagName !== "INPUT" || !(el.dataset.bf || el.dataset.rf)) return;
  if (setField(el)) { fieldEdited = el; changed(false); }
});
document.addEventListener("focusout", ev => {
  const el = ev.target; if (el === fieldEdited) { fieldEdited = null; laterRender(el); }
});

function periodControls(P){
  const C = build();
  const ys = new Set(); const y0 = new Date().getFullYear();
  for (let y = y0-2; y <= y0+2; y++) ys.add(y);
  if (isFinite(C.first)) for (let y = Math.floor(C.first/12); y <= Math.floor(C.last/12); y++) ys.add(y);
  const years = [...ys].sort();
  const mSel = (id, v, blank) => `<select id="${id}" class="in">${blank?`<option value="">–</option>`:""}${MAANDEN.map((m,i)=>`<option value="${i}" ${v!==null&&v%12===i?"selected":""}>${m}</option>`).join("")}</select>`;
  const ySel = (id, v, blank) => `<select id="${id}" class="in">${blank?`<option value="">–</option>`:""}${years.map(y=>`<option ${v!==null&&Math.floor(v/12)===y?"selected":""}>${y}</option>`).join("")}</select>`;
  const same = ui.p2 === ui.p1;
  return `<div class="row">
    <span><b>Van</b> ${mSel("pm1",P.p1)} ${ySel("py1",P.p1)}</span>
    <span><b>t/m</b> ${mSel("pm2",same?null:P.p2,true)} ${ySel("py2",same?null:P.p2,true)}</span>
    <button class="btn sm" data-act="per" data-v="prev">‹ vorige</button><button class="btn sm" data-act="per" data-v="next">volgende ›</button>
    <button class="btn sm" data-act="per" data-v="year">heel jaar</button>
  </div>`;
}

  sum += `<tr class="saldo"><td>SALDO</td>${cells(R.saldo, null, eur0)}</tr>`;
  sum += `<tr style="background:#EFEAF7"><td colspan="1" style="color:#6A4FA3"><b>Verwacht gespaard dit jaar</b><div class="small muted">${esc((D.groups.find(g=>g.savings)||{name:"sparen"}).name.toLowerCase())} + saldo</div></td>
    <td class="sec-p" colspan="4"></td><td class="gap"></td><td class="sec-y" colspan="3"></td><td class="gap"></td>
    <td class="n sec-f">${eur0(R.spaar.BJ)}</td><td class="sec-f"></td><td class="sec-f"></td><td class="n sec-f"><b>${eur0(R.spaar.prog)}</b></td><td class="n sec-f ${cls(R.spaar.prog-R.spaar.BJ)}"><b>${eur0(R.spaar.prog-R.spaar.BJ)}</b></td></tr>`;

    }

  }
  return `<div class="card"><div class="row"><h2 style="margin:0">Vergelijk</h2><span class="spacer"></span>${periodControls(P)}</div>
    ${!P.ok?`<p class="warn">⚠ 'Tot en met' ligt vóór 'Van'.</p>`:""}
    <div class="row small" style="margin-top:8px">${msgQ}<span class="muted">· ${R.nP} transacties · saldo rekening (bij − af): <b>${eur(R.saldoP)}</b></span></div></div>
  <div class="row secsw" style="margin-bottom:8px">
    <button class="btn sm ${ui.cmpSec==="p"?"primary":""}" data-act="sec" data-v="p">Periode</button>
    <button class="btn sm ${ui.cmpSec==="y"?"primary":""}" data-act="sec" data-v="y">Jaar t/m</button>

    Prognose = werkelijk tot nu toe + verwachte rest (per categorie volgens begroting of gemiddelde, zie Categorieën).</p></div>
  <div class="card">${chartSvg(R)}</div>
  <div class="card tw"><div class="row" style="margin-bottom:6px"><h3 style="margin:0">Per categorie</h3><span class="spacer"></span>
    <label class="chk small"><input type="checkbox" data-act="empty" ${ui.showEmpty?"checked":""}> toon ook categorieën zonder bedragen</label></div>

    <p class="small muted">Klik op een categorie om de transacties te zien.</p></div>`;
}
function chartSvg(R){
  const gs = R.groups, W = 640, H = 230, pad = 34, bw = (W - pad*2) / gs.length;
  const max = Math.max(1, ...gs.flatMap(x => [x.s.B, x.s.W]));
  const y = v => H - 30 - (Math.max(0,v) / max) * (H - 60);
  let bars = "";
  gs.forEach((x, i) => {
    const cx = pad + i*bw + bw/2, w = Math.min(34, bw/3);
    bars += `<rect x="${cx-w-2}" y="${y(x.s.B)}" width="${w}" height="${H-30-y(x.s.B)}" rx="3" fill="#A3A29C"><title>Begroot ${eur(x.s.B)}</title></rect>
      <rect x="${cx+2}" y="${y(x.s.W)}" width="${w}" height="${H-30-y(x.s.W)}" rx="3" fill="#${x.g.color}"><title>Werkelijk ${eur(x.s.W)}</title></rect>
      <text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11" fill="#52514e">${esc(x.g.name)}</text>`;
  });
  return `<h3>Begroot vs. werkelijk per groep <span class="muted small">(gekozen periode)</span></h3>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Staafgrafiek begroot en werkelijk per groep">
    <line x1="${pad}" x2="${W-pad}" y1="${H-30}" y2="${H-30}" stroke="#ccc"/>${bars}
    <rect x="${W-170}" y="6" width="10" height="10" fill="#A3A29C"/><text x="${W-155}" y="15" font-size="11">Begroot</text>
    <rect x="${W-95}" y="6" width="10" height="10" fill="#555"/><text x="${W-80}" y="15" font-size="11">Werkelijk</text></svg>`;
}

function catOptions(sel, withAuto, autoLabel){
  let h = withAuto ? `<option value="">${esc(autoLabel)}</option>` : `<option value="">– kies –</option>`;
  for (const g of D.groups) {
    const cs = D.categories.filter(c => c.group === g.name); if (!cs.length) continue;
    h += `<optgroup label="${esc(g.name)}">${cs.map(c => `<option ${c.name===sel?"selected":""}>${esc(c.name)}</option>`).join("")}</optgroup>`;
  }
  if (sel && !D.categories.some(c => c.name === sel)) h += `<option selected>${esc(sel)} (bestaat niet meer)</option>`;
  return h;
}
function txList(){
  const C = build(); const P = period();
  let list = D.transactions.slice();
  if (ui.txMonth === "periode") list = list.filter(t => { const m = mi(t.date); return m >= P.p1 && m <= P.p2; });
  else if (ui.txMonth !== "alle") { const m = +ui.txMonth; list = list.filter(t => mi(t.date) === m); }
  if (ui.txOnlyQ) list = list.filter(t => C.res.get(t.id).cat === "?");
  else if (ui.txCat) list = list.filter(t => C.res.get(t.id).cat === ui.txCat);
  if (ui.txSearch) { const s = ui.txSearch.toLowerCase(); list = list.filter(t => ((t.name||"")+" "+(t.desc||"")+" "+(t.counter||"")).toLowerCase().includes(s)); }

  return list;
}

/* ---------- Begroting ---------- */
function vBegroting(){
  const C = build();
  const lc = (a,b) => (a||"").localeCompare(b||"", "nl", {sensitivity:"base"});
  const sorter = {categorie:(a,b)=>lc(a.category,b.category)||lc(a.name,b.name), naam:(a,b)=>lc(a.name,b.name)||lc(a.category,b.category),
    bedrag:(a,b)=>(+b.amount||0)-(+a.amount||0), status:(a,b)=>budgetStatus(a).localeCompare(budgetStatus(b))}[ui.budSort];
  const blocks = D.groups.map(g => ({g, lines: D.budget.filter(b => C.catByName.get(b.category)?.group === g.name)}));
  const orphan = D.budget.filter(b => !C.catByName.has(b.category));
  const lineRow = b => { const st = budgetStatus(b); if (ui.budOnlyActive && st !== "actief") return "";
    const pm = b.freq === "eenmalig" ? "" : (+b.amount||0) * (FAC[b.freq] ?? 0);
    return `<tr data-id="${esc(b.id)}">
      <td><input type="text" data-bf="name" value="${esc(b.name)}" placeholder="Naam"></td>
      <td><select data-bf="category">${catOptions(b.category,false)}</select></td>
      <td><input type="number" step="0.01" data-bf="amount" value="${esc(b.amount)}" style="text-align:right"></td>
      <td><select data-bf="freq">${FREQS.map(f=>`<option ${b.freq===f?"selected":""}>${f}</option>`).join("")}</select></td>

/* ---------- Abonnementen ---------- */
function detectSubs(){
  const C = build(); const groups = new Map();
  for (const t of D.transactions) {
    if (t.amount >= 0) continue;
    const key = (shopOf(t) || t.counter || "").toLowerCase().replace(/\d{3,}/g, "").replace(/\s+/g, " ").trim();
    if (!key) continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }
  const out = []; const lastM = C.last;
  for (const [key, ts] of groups) {
    ts.sort((a,b) => a.date < b.date ? -1 : 1);
    const months = [...new Set(ts.map(t => mi(t.date)))];
    if (months.length < 3) continue;
    if (ts.length > months.length * 1.5) continue;                       // vaker dan ~1x per maand → geen abonnement
    const amts = ts.map(t => -t.amount); const lo = Math.min(...amts.slice(-6)), hi = Math.max(...amts.slice(-6));
    if (hi > lo * 1.25 + 1) continue;                                    // bedragen te verschillend
    const last = ts[ts.length-1], prev = ts[ts.length-2];
    const flags = [];
    if (-last.amount > -prev.amount * 1.02 + 0.01) flags.push(`duurder (was ${eur(-prev.amount)})`);
    if (mi(last.date) < lastM - 1) flags.push("gestopt?");
    if (months[0] >= lastM - 3) flags.push("nieuw");
    out.push({name: shopOf(last) || last.counter, cat: C.res.get(last.id).cat, last: -last.amount, lastDate: last.date, since: ts[0].date, n: ts.length, flags,
      yearly: amts.slice(-12).reduce((a,b)=>a+b,0) / Math.min(12, months.length) * 12});
  }
  return out.sort((a,b) => b.last - a.last);
}
function vAbonnementen(){
  const C = build(); const nm = isFinite(C.first) ? C.last - C.first + 1 : 0;
  const subs = detectSubs();
  const tot = subs.filter(s => !s.flags.includes("gestopt?")).reduce((a,s)=>a+s.yearly,0);
  return `<div class="card"><h2>Abonnementen</h2><p class="small muted" style="margin:0">Automatisch herkend: vaste afschrijvingen die minstens 3 maanden terugkomen met (bijna) hetzelfde bedrag.
    Je krijgt een melding als iets <b>duurder</b> wordt, <b>nieuw</b> is of mogelijk <b>gestopt</b> is.</p></div>
    ${nm < 3 ? `<div class="card"><p class="warn" style="margin:0">Nog te weinig gegevens: er ${nm===1?"is":"zijn"} ${nm} maand${nm===1?"":"en"} aan transacties. Vanaf 3 maanden worden abonnementen herkend.</p></div>` : ""}
    ${subs.length ? `<div class="kpis"><div class="kpi"><div class="k">Herkende abonnementen</div><div class="v">${subs.length}</div></div><div class="kpi"><div class="k">Samen per jaar (geschat)</div><div class="v">${eur0(tot)}</div></div></div>

    ${subs.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.cat)}</td><td class="n">${eur(s.last)}</td><td>${fmtDate(s.lastDate)}</td><td>${fmtDate(s.since)}</td><td class="n">${eur0(s.yearly)}</td>

document.addEventListener("click", async ev => {
  const tab = ev.target.closest("[data-tab]");
  if (tab) { view = tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.type === "checkbox") return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "open": $("#fileOpen").click(); break;
    case "new": D = normalize(emptyData()); fileName = ""; fileHandle = null; password = null; invalidate(); setDirty(true); view = "categorieen"; render(); break;
    case "recover": recover(); break;
    case "save": save(false); break;
    case "saveas": save(true); break;
    case "close": if (dirty && !await confirmDlg("Je hebt wijzigingen die nog niet zijn bewaard. Toch sluiten?", "Sluiten")) return;
      D = null; fileHandle = null; fileName = ""; password = null; setDirty(false); try{localStorage.removeItem(LS_KEY);}catch(e){} render(); break;
    case "import": $("#csvOpen").click(); break;
    case "per": { const P = period(); let span = P.p2 - P.p1;
      if (el.dataset.v === "prev") { ui.p1 -= span+1; ui.p2 = ui.p1 + span; }
      else if (el.dataset.v === "next") { ui.p1 += span+1; ui.p2 = ui.p1 + span; }
      else { ui.p1 = Math.floor(P.p2/12)*12; ui.p2 = ui.p1 + 11; }
      render(); break; }
    case "sec": ui.cmpSec = el.dataset.v; render(); break;
    case "goq": ui.txMonth = "periode"; ui.txOnlyQ = true; ui.txCat = ""; view = "transacties"; render(); break;
    case "gocat": ui.txMonth = "periode"; ui.txOnlyQ = false; ui.txCat = el.dataset.cat; view = "transacties"; render(); window.scrollTo(0,0); break;
    case "mkrule": ruleDialog(D.transactions.find(t => t.id === id)); break;
    case "addbud": { const g = el.dataset.g; const c = D.categories.find(c => c.group === g);
      const d = new Date(); const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
      D.budget.push({id:uid("b"), name:"", category:c?c.name:"", amount:"", freq:"maand", start:iso, end:"", note:""}); changed(); break; }
    case "delbud": if (await confirmDlg("Deze begrotingsregel verwijderen?", "Verwijder")) { D.budget = D.budget.filter(b => b.id !== id); changed(); } break;
    case "addrule": { const k = el.dataset.kind; const r = k==="words" ? {id:uid("w"),text:"",category:"",dir:"",note:""} : k==="names" ? {id:uid("n"),key:"",category:"",dir:"",note:""} : {id:uid("s"),sns:"",category:""};
      if (k === "words") D.rules.words.unshift(r); else D.rules[k].push(r); changed(); break; }
    case "delrule": if (await confirmDlg("Deze regel verwijderen?", "Verwijder")) { const k = el.dataset.kind; D.rules[k] = D.rules[k].filter(r => r.id !== id); changed(); } break;
    case "mv": { const arr = D.rules.words, i = arr.findIndex(r => r.id === id), j = i + (+el.dataset.v); if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; changed(); break; }
    case "mvcat": { const arr = D.categories, i = arr.findIndex(c => c.id === id); const g = arr[i].group; let j = i;
      do { j += +el.dataset.v; } while (j >= 0 && j < arr.length && arr[j].group !== g);
      if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; changed(); break; }
    case "addcat": { let n = "Nieuwe categorie", k = 2; while (D.categories.some(c => c.name === n)) n = "Nieuwe categorie " + k++;
      D.categories.push({id:uid("c"), name:n, group:el.dataset.g, forecast:"", note:""}); changed(); break; }
    case "delcat": deleteCategory(id); break;

function renameCategory(c, n, el){

/* ---------- CSV-import ---------- */
function parseCsv(text){
  const rows = []; let row = [], f = "", q = false;
  const sep = (text.split("\n")[0].match(/;/g)||[]).length >= (text.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
async function readText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("\uFFFD")) t = new TextDecoder("windows-1252").decode(buf);
  return t.replace(/^﻿/, "");
}
function snsRows(text){
  const rows = parseCsv(text); if (!rows.length) throw new Error("Leeg bestand.");
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = n => h.indexOf(n);
  const need = ["datum","je rekening","van / naar","naam","bedrag bij / af","omschrijving"];
  for (const n of need) if (col(n) < 0) throw new Error(`Dit lijkt geen SNS-export: kolom '${n}' ontbreekt.`);
  const g = (r, n) => { const i = col(n); return i >= 0 ? (r[i] ?? "").trim() : ""; };
  const dt = s => { const m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m2 ? m2[0] : ""; };
  const num = s => { s = s.replace(/\s/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); return parseFloat(s) || 0; };
  return rows.slice(1).map(r => {
    const acc = g(r, "je rekening"), seq = g(r, "volgnummer"), date = dt(g(r, "datum")), amount = num(g(r, "bedrag bij / af")), desc = g(r, "omschrijving");
    const id = seq ? `${acc}|${seq}` : `${acc}|${date}|${amount}|${desc.slice(0,60)}`;
    return {id, account:acc, date, counter:g(r,"van / naar"), name:g(r,"naam"), amount, code:g(r,"code"), type:g(r,"type"), seq,
      ref:g(r,"betalingskenmerk"), desc, snsCat:g(r,"categorie"), manual:""};
  }).filter(t => t.date);
}

    <div class="actions"><button class="btn" data-r="cancel">Annuleer</button><button class="btn primary" data-r="ok">Importeer <span id="impN">0</span> transacties</button></div>`, m);
  if (!pick || !pick.length) return;

/* ---------- bestand openen / bewaren ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function serialize(){
  const json = JSON.stringify(D);
  if (!password) return JSON.stringify(D, null, 1);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await keyFrom(password, salt);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(json));
  let s = ""; const u = new Uint8Array(ct); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return JSON.stringify({app:"begroting", encrypted:true, v:1, salt:b64(salt), iv:b64(iv), data:btoa(s)});
}
async function deserialize(text){

  if (o.encrypted) {
    if (!crypto?.subtle) throw new Error("Deze browser kan versleutelde bestanden niet openen.");
    for (let tries = 0; tries < 5; tries++) {
      const pw = await askPassword("Dit bestand is beveiligd", false); if (!pw) throw new Error("cancel");
      try { const key = await keyFrom(pw, unb64(o.salt));
        const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(o.iv)}, key, unb64(o.data));
        password = pw; return normalize(JSON.parse(new TextDecoder().decode(pt))); }
      catch(e) { toast("Onjuist wachtwoord."); }
    }

  }
  if (o.app !== "begroting") throw new Error("Dit is geen gegevensbestand van dit programma.");
  password = null; return normalize(o);
}
async function openFile(file, handle = null){
  if (dirty && D && !await confirmDlg("Je hebt wijzigingen die nog niet zijn bewaard. Toch een ander bestand openen?", "Openen")) return;
  try { const d = await deserialize(await file.text()); D = d; fileName = file.name; fileHandle = handle; ui.p1 = ui.p2 = undefined; invalidate(); setDirty(false); safetyCopy(true); view = "vergelijk"; render(); toast("Bestand geopend."); }
  catch(e) { if (e.message !== "cancel") dialog(`<h3>Openen lukt niet</h3><p>${esc(e.message)}</p><div class="actions"><button class="btn primary" data-r="ok">OK</button></div>`); }
}
async function save(as){
  const text = await serialize();
  const suggested = fileName || "begroting-gegevens.json";
  if ("showSaveFilePicker" in window) {
    try {
      if (!fileHandle || as) fileHandle = await window.showSaveFilePicker({suggestedName: suggested, types:[{description:"Begrotingsgegevens", accept:{"application/json":[".json"]}}]});
      const w = await fileHandle.createWritable(); await w.write(text); await w.close();
      fileName = fileHandle.name; setDirty(false); safetyCopy(true); render(); toast("Bewaard."); return;
    } catch(e) { if (e.name === "AbortError") return; fileHandle = null; }
  }
  if (!await download(suggested, text, "application/json")) return;
  fileName = suggested; setDirty(false); safetyCopy(true); render();
  toast("Bewaard als download – vervang je oude bestand door deze nieuwe versie.");
}
let safetyTimer = null;
function safetyCopy(now){
  clearTimeout(safetyTimer);
  const go = async () => { if (!D) return; try { localStorage.setItem(LS_KEY, JSON.stringify({when:new Date().toLocaleString("nl-NL"), name:fileName, blob: await serialize()})); } catch(e) {} };
  if (now) go(); else safetyTimer = setTimeout(go, 800);
}
async function recover(){
  try { const rec = JSON.parse(localStorage.getItem(LS_KEY)); const d = await deserialize(rec.blob); D = d; fileName = rec.name || ""; fileHandle = null; invalidate(); setDirty(true); render();
    toast("Veiligheidskopie geladen – vergeet niet te bewaren."); }
  catch(e) { if (e.message !== "cancel") toast("De veiligheidskopie kon niet worden geladen."); }
}
function dropZone(el, cb){
  if (!el) return;
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over"); if (e.dataTransfer.files.length) cb([...e.dataTransfer.files]); });
}
$("#saveBtn").onclick = () => save(false);
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s" && D) { e.preventDefault(); save(false); } });

render();
</script>
